<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shopping • EmpathEra</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin:0; background:#0e0f12; color:#e5e7eb; }
    header { background:#12161b; padding:12px 16px; }
    nav a { color:#6ee7ff; margin-right:16px; text-decoration:none; }
    nav a.active { color:#fff; font-weight:700; }
    main { max-width:980px; margin:24px auto; padding:0 16px; }
    h1 { font-size:32px; margin:8px 0 20px; }

    .composer { background:#1a1d22; border-radius:18px; padding:16px; margin-bottom:22px; box-shadow:0 10px 28px rgba(0,0,0,.25); }
    .composer input, .composer textarea { width:100%; margin:6px 0; padding:8px; background:#0f1217; border:none; border-radius:8px; color:#fff; }
    button { background:#18c964; border:none; border-radius:10px; color:#04150e; padding:9px 14px; font-weight:700; cursor:pointer; }

    .grid { display:grid; grid-template-columns:1fr; gap:18px; }

    .card { background:#1a1d22; border-radius:18px; padding:16px; box-shadow:0 10px 28px rgba(0,0,0,.25); position:relative; }
    .card video, .card img { width:100%; border-radius:12px; margin-top:8px; max-height:380px; object-fit:cover; }
    .title { font-size:18px; font-weight:700; color:#6ee7ff; }
    .price { color:#18c964; font-weight:700; margin:4px 0; }
    .desc { color:#cbd5e1; margin:6px 0; }
    .timestamp { font-size:12px; color:#94a3b8; margin-top:6px; }
    .delete { position:absolute; top:10px; right:10px; background:#ff8b24; color:#fff; border:none; border-radius:8px; padding:4px 8px; cursor:pointer; }

    .reactions { display:flex; gap:18px; align-items:center; margin:8px 0 12px; }
    .react { cursor:pointer; user-select:none; }
    .react .count { margin-left:6px; color:#cbd5e1; }
    .comments { background:#151a20; border-radius:14px; padding:10px; }
    .comment { margin:6px 0; }
    .comment-row { display:flex; gap:10px; margin-top:8px; }
    .comment-row input { flex:1; padding:9px 10px; border:none; border-radius:10px; background:#0f1217; color:#fff; }
    .comment-row .btn { padding:9px 13px; border:none; border-radius:10px; background:#18c964; color:#04150e; cursor:pointer; font-weight:700; }
    .see-more { background:#2a323c; color:#cfe; border:none; border-radius:10px; padding:7px 12px; cursor:pointer; font-weight:700; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="feed.html">Feed</a>
      <a href="vibe.html">Vibe</a>
      <a href="intelligence.html">Intelligence</a>
      <a href="shopping.html" class="active">Shopping</a>
      <a href="message.html">Message</a>
      <a href="group.html">Group</a>
      <a href="ebooks.html">Ebooks/Audio</a>
      <a href="profile.html">Profile</a>
      <a href="ai.html">EmpathEra AI</a>
      <a href="#" id="btnLogout" style="color:#ff7777;font-weight:700;">Logout</a>
    </nav>
  </header>

  <main>
    <h1>Shopping 🛍️</h1>
    <section class="composer">
      <input id="title" placeholder="Item title" />
      <input id="price" placeholder="Price" />
      <textarea id="desc" placeholder="Description"></textarea>
      <input id="file" type="file" accept="image/*,video/*" />
      <button id="postBtn">Post Item</button>
      <div id="err" style="color:#f87171;margin-top:10px;"></div>
    </section>
    <div id="shoppingList" class="grid"></div>
  </main>

  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="./auth-guard.js"></script>
  <script type="module" src="./logout.js"></script>
  <script type="module" src="./shopping.js"></script>
</body>
</html>
