<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Groups • EmpathEra</title>
  <style>
    :root {
      --bg:#0e0f12; --panel:#1a1d22; --ink:#e5e7eb;
      --muted:#94a3b8; --accent:#18c964;
    }
    html,body { margin:0; background:var(--bg); color:var(--ink); font:16px system-ui; }

    /* ---- NAV ---- */
    header { background:#12161b; padding:12px 16px; }
    nav { display:flex; flex-wrap:wrap; justify-content:center; }
    nav a {
      color:#6ee7ff; margin:6px 10px; text-decoration:none; font-weight:500;
      padding:4px 10px; border-radius:8px;
    }
    nav a.active { background:var(--accent); color:#04150e; font-weight:700; }
    nav a:hover { color:#ffffff; }

    /* ---- MAIN ---- */
    main { max-width:1000px; margin:24px auto; padding:0 16px; }
    h2 { margin-top:10px; color:#6ee7ff; }

    /* ---- CREATE BOX ---- */
    .create-box {
      background:var(--panel); border-radius:14px; padding:16px; margin-bottom:22px;
      box-shadow:0 8px 24px rgba(0,0,0,.25);
    }
    .create-box input,
    .create-box textarea {
      width:100%; padding:10px; border:none; border-radius:8px;
      background:#0f1217; color:#fff; margin:5px 0;
    }
    .create-box button {
      padding:10px 14px; border:none; border-radius:8px;
      background:var(--accent); color:#04150e; cursor:pointer; font-weight:700;
    }
    #err { color:#f87171; margin-top:10px; }

    /* ---- GROUP GRID ---- */
    .group-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
      gap:18px;
    }
    .group-card {
      background:#1a1d22;
      border-radius:14px;
      padding:12px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      box-shadow:0 8px 24px rgba(0,0,0,0.3);
      transition:transform 0.2s ease, box-shadow 0.2s ease;
    }
    .group-card:hover {
      transform:translateY(-3px);
      box-shadow:0 10px 28px rgba(0,0,0,0.4);
    }
    .group-card video,
    .group-card img {
      width:100%;
      border-radius:10px;
      max-height:220px;
      object-fit:cover;
    }
    .group-card h3 { margin:10px 0 6px; color:#35fbc8; font-size:18px; }
    .group-card p { font-size:14px; color:#cbd5e1; margin:4px 0 8px; line-height:1.4; }
    .group-card small { font-size:12px; color:#94a3b8; }

    .group-card button {
      margin-top:8px;
      padding:8px 12px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
      transition:0.2s;
    }
    .join-btn { background:#18c964; color:#04150e; }
    .open-btn { background:#2563eb; color:#fff; }
    .delete-btn {
      background:#ef4444; color:#fff;
      align-self:flex-end; margin-top:6px;
      font-size:12px;
    }

    @media (max-width:768px) {
      nav { flex-wrap:wrap; }
      nav a { margin:4px 6px; font-size:15px; }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="feed.html">Feed</a>
      <a href="vibe.html">Vibe</a>
      <a href="intelligence.html">Intelligence</a>
      <a href="shopping.html">Shopping</a>
      <a href="message.html">Message</a>
      <a href="group.html" class="active">Group</a>
      <a href="ebooks.html">Ebooks/Audio</a>
      <a href="profile.html">Profile</a>
      <a href="ai.html">EmpathEra AI</a>
      <a href="#" id="logoutBtn">Logout</a>
    </nav>
  </header>

  <main>
    <h2>Create or Join a Group</h2>

    <div class="create-box">
      <input id="groupName" type="text" placeholder="Group name" />
      <textarea id="groupDesc" placeholder="Short description"></textarea>
      <input id="groupFile" type="file" accept="image/*,video/*" />
      <button id="createBtn">Create Group</button>
      <div id="err"></div>
    </div>

    <div id="groupList" class="group-grid"></div>
  </main>

  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="./auth-guard.js"></script>
  <script type="module" src="./logout.js"></script>
  <script type="module" src="./group.js"></script>
</body>
</html>
