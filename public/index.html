<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EmpathEra Social</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0e0f12;
      color: #e5e7eb;
      margin: 0;
    }
    header {
      background: #12161b;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header .logo {
      font-size: 20px;
      font-weight: bold;
      color: #38f2d3;
    }
    nav a,
    nav button {
      margin-left: 12px;
      color: #6ee7ff;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    nav a:hover {
      color: #ffffff;
    }
    main {
      max-width: 400px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 20px;
      text-align: center;
    }
    section {
      margin-bottom: 24px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input {
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #1a1d22;
      color: #fff;
    }
    button {
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button[type="submit"],
    .google-btn,
    .guest-btn {
      background: #18c964;
      color: #04150e;
    }
    .google-btn {
      background: #4285f4;
      color: #fff;
    }
    .guest-btn {
      background: #666;
      color: #fff;
    }
    .support-link {
      color: #6ee7ff;
      text-decoration: none;
      font-size: 14px;
    }
    .logout-btn {
      background: #ff5b5b;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">🌍 EmpathEra</div>
    <nav>
      <a href="about.html">About</a>
      <a href="https://paypal.me/jasonnguyen714" target="_blank" rel="noopener">Donate</a>
      <!-- ✅ Redirect directly to deployed AI app -->
      <a href="https://ai.empatherasocial.com" target="_blank">EmpathEra AI</a>
      <button id="btnLogout" class="logout-btn">Logout</button>
    </nav>
  </header>

  <main>
    <h1>Welcome to EmpathEra Social</h1>

    <!-- Signup -->
    <section>
      <h2>Sign Up</h2>
      <form id="signupForm">
        <input type="email" id="signupEmail" placeholder="Email" required />
        <input type="password" id="signupPassword" placeholder="Password" required />
        <button type="submit">Sign Up</button>
      </form>
    </section>

    <!-- Login -->
    <section>
      <h2>Login</h2>
      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
    </section>

    <!-- Social / Guest logins -->
    <section>
      <button id="googleLogin" class="google-btn">Sign in with Google</button>
      <button id="guestLogin" class="guest-btn">Continue as Guest</button>
    </section>

    <!-- Support -->
    <section>
      <a href="support.html" class="support-link">Support</a>
    </section>
  </main>

  <!-- Firebase scripts -->
  <script type="module" src="./firebase-config.js"></script>
  <script type="module" src="./login-guard.js"></script>
  <script type="module" src="./index.js"></script>
</body>
</html>
