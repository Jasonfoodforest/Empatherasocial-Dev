<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Messages · EmpathEra</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header
      style="
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
      "
    >
      <nav>
        <a href="feed.html">Feed</a>
        <a href="explore.html">Explore</a>
        <a href="intelligence.html">Intelligence</a>
        <a href="shopping.html">Shopping</a>
        <a href="messages.html" style="color: limegreen; font-weight: bold"
          >Message</a
        >
        <a href="group.html">Group</a>
        <a href="ebooks.html">Ebooks</a>
        <a href="profile.html">Profile</a>
      </nav>
      <div>
        <span id="userEmail" style="margin-right: 10px"></span>
        <button
          id="logoutBtn"
          style="
            background: limegreen;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
          "
        >
          Logout
        </button>
      </div>
    </header>

    <main style="display: flex; height: calc(100vh - 60px)">
      <!-- Sidebar -->
      <aside
        style="
          width: 25%;
          border-right: 1px solid #444;
          padding: 10px;
          overflow-y: auto;
        "
      >
        <h3>New Chat</h3>
        <input
          id="newChatEmail"
          type="email"
          placeholder="Enter email..."
          style="
            width: 95%;
            margin-bottom: 6px;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #444;
          "
        />
        <button
          id="startChatBtn"
          style="
            width: 95%;
            padding: 8px;
            background: limegreen;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
          "
        >
          Start Chat
        </button>

        <h3>Chats</h3>
        <div id="chatList"></div>

        <h3>Groups</h3>
        <div id="groupList"></div>
      </aside>

      <!-- Chat box -->
      <section style="flex: 1; display: flex; flex-direction: column">
        <div id="chatHeader" style="padding: 10px; font-weight: bold">
          (none)
        </div>
        <div
          id="messages"
          style="
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            border-top: 1px solid #444;
            border-bottom: 1px solid #444;
          "
        ></div>
        <div style="padding: 10px; display: flex; gap: 6px">
          <input
            id="messageInput"
            type="text"
            placeholder="Type a message..."
            style="
              flex: 1;
              padding: 6px;
              border-radius: 4px;
              border: 1px solid #444;
            "
          />
          <input id="fileInput" type="file" />
          <button
            id="sendBtn"
            style="
              padding: 10px 16px;
              background: limegreen;
              border: none;
              color: white;
              font-weight: bold;
              border-radius: 6px;
              cursor: pointer;
            "
          >
            Send
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="./message.js"></script>
  </body>
</html>
