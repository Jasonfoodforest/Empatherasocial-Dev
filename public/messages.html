<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EmpathEra Social – Messages</title>
    <script type="module" src="./messages.js" defer></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f5f5f5;
      }
      nav {
        background: #222;
        padding: 10px;
        display: flex;
      }
      nav a {
        color: white;
        margin-right: 15px;
        text-decoration: none;
        padding: 5px 10px;
      }
      nav a.active {
        background: lightgreen;
        border-radius: 4px;
        color: black;
      }
      nav button {
        margin-left: auto;
        background: red;
        border: none;
        padding: 6px 12px;
        color: white;
        border-radius: 4px;
        cursor: pointer;
      }
      .container {
        display: flex;
        height: calc(100vh - 50px);
      }
      .sidebar {
        width: 25%;
        background: #fff;
        border-right: 1px solid #ccc;
        padding: 10px;
        overflow-y: auto;
      }
      .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 10px;
      }
      #chatHeader {
        font-weight: bold;
        margin-bottom: 10px;
      }
      #messages {
        flex: 1;
        background: #eee;
        border: 1px solid #ccc;
        padding: 10px;
        overflow-y: auto;
        border-radius: 5px;
      }
      .messageBox {
        background: #fff;
        padding: 8px;
        margin-bottom: 5px;
        border-radius: 5px;
        border: 1px solid #ddd;
      }
      #msgInput {
        width: 70%;
        font-size: 16px;
        padding: 10px;
        border-radius: 5px;
        resize: none;
        margin-top: 5px;
      }
      #sendBtn {
        background: green;
        color: white;
        border: none;
        padding: 12px 20px;
        margin-left: 10px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      #sendBtn:hover {
        background: darkgreen;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="feed.html">Feed</a>
      <a href="explore.html">Explore</a>
      <a href="intelligence.html">Intelligence</a>
      <a href="shopping.html">Shopping</a>
      <a href="messages.html" class="active">Message</a>
      <a href="group.html">Group</a>
      <a href="ebooks.html">Ebooks</a>
      <a href="profile.html">Profile</a>
      <button id="logoutBtn">Logout</button>
    </nav>

    <div class="container">
      <div class="sidebar">
        <input type="email" id="newChatEmail" placeholder="Enter email..." />
        <button id="startChatBtn">Start Chat</button>
        <h3>Chats</h3>
        <ul id="chatList"></ul>
        <h3>Groups</h3>
        <ul id="groupList"></ul>
      </div>

      <div class="chat-area">
        <div id="chatHeader">Select a chat</div>
        <div id="messages"></div>
        <div style="display: flex; align-items: center; margin-top: 10px">
          <textarea
            id="msgInput"
            placeholder="Type a message..."
            rows="3"
          ></textarea>
          <input type="file" id="fileInput" />
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </body>
</html>
