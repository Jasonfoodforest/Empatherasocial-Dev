<!doctype html>
<html>
  <head>
    <title>Seeding Firestore</title>
  </head>
  <body>
    <h1>Seeding Firestore… check console (F12)</h1>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
      import {
        getFirestore,
        doc,
        setDoc,
        collection,
        addDoc,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

      // 🔑 Firebase config (same as your app)
      const firebaseConfig = {
        apiKey: "AIzaSyCegX-9F8lvrBr85U8-9kva0_P8o2Ik81A",
        authDomain: "empatherasocial-dev.firebaseapp.com",
        projectId: "empatherasocial-dev",
        storageBucket: "empatherasocial-dev.firebasestorage.app",
        messagingSenderId: "890072969016",
        appId: "1:890072969016:web:27640b219e0564331c5bcd",
      };

      // 🔥 Init Firebase
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // 🧑‍🤝‍🧑 Seed Users
      const users = [
        "jasonfoodforest714@gmail.com",
        "helper1@empatherasocial.com",
        "helper2@empatherasocial.com",
      ];

      async function seed() {
        console.log("🌱 Starting seed…");

        // --- Direct Chat Jason <-> Helper1
        const rk1 = [users[0], users[1]].sort().join("_");
        await setDoc(
          doc(db, "chats", rk1),
          {
            participants: [users[0], users[1]],
            lastAt: serverTimestamp(),
            lastMsg: "Seeded chat between Jason and Helper1",
          },
          { merge: true },
        );

        await addDoc(collection(db, "messages", rk1, "chats"), {
          text: "Hey Helper1 👋",
          senderEmail: users[0],
          createdAt: serverTimestamp(),
        });
        await addDoc(collection(db, "messages", rk1, "chats"), {
          text: "Hello Jason 🚀",
          senderEmail: users[1],
          createdAt: serverTimestamp(),
        });

        // --- Direct Chat Jason <-> Helper2
        const rk2 = [users[0], users[2]].sort().join("_");
        await setDoc(
          doc(db, "chats", rk2),
          {
            participants: [users[0], users[2]],
            lastAt: serverTimestamp(),
            lastMsg: "Seeded chat between Jason and Helper2",
          },
          { merge: true },
        );

        await addDoc(collection(db, "messages", rk2, "chats"), {
          text: "Hi Helper2 😎",
          senderEmail: users[0],
          createdAt: serverTimestamp(),
        });
        await addDoc(collection(db, "messages", rk2, "chats"), {
          text: "What’s up Jason!",
          senderEmail: users[2],
          createdAt: serverTimestamp(),
        });

        // --- Group with all 3
        const groupId = "seed-group-1";
        await setDoc(doc(db, "groups", groupId), {
          name: "Seed Test Group",
          members: users,
          createdAt: serverTimestamp(),
        });

        await addDoc(collection(db, "groupMessages", groupId, "items"), {
          text: "Welcome to the group 👨‍👩‍👧",
          senderEmail: users[0],
          createdAt: serverTimestamp(),
        });
        await addDoc(collection(db, "groupMessages", groupId, "items"), {
          text: "Glad to be here 🙌",
          senderEmail: users[1],
          createdAt: serverTimestamp(),
        });
        await addDoc(collection(db, "groupMessages", groupId, "items"), {
          text: "Seed data complete!",
          senderEmail: users[2],
          createdAt: serverTimestamp(),
        });

        console.log("✅ Seed done. Check Firestore!");
      }

      seed();
    </script>
  </body>
</html>
