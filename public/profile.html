<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile • EmpathEra</title>
  <style>
    :root {
      --bg:#0e0f12; --panel:#1a1d22; --ink:#e5e7eb;
      --muted:#94a3b8; --accent:#18c964;
    }
    html,body { margin:0; background:var(--bg); color:var(--ink); font:16px system-ui; }

    /* ---- NAV identical to group / ebooks ---- */
    header { background:#12161b; padding:12px 16px; }
    nav { display:flex; flex-wrap:wrap; justify-content:center; }
    nav a {
      color:#6ee7ff;
      margin:6px 10px;
      text-decoration:none;
      font-weight:500;
      padding:4px 10px;
      border-radius:8px;
      transition:color .2s ease, background .2s ease;
    }
    nav a.active {
      background:var(--accent);
      color:#04150e;
      font-weight:700;
    }
    nav a:hover { color:#ffffff; }

    /* ---- MAIN PROFILE CONTENT ---- */
    main { max-width:900px; margin:20px auto; padding:0 18px; }
    h1 { color:#6ee7ff; text-align:center; }

    .profile-card {
      background:#1f2329; border-radius:12px; padding:20px;
      display:flex; flex-direction:column; align-items:center;
    }
    .profile-card img {
      width:120px; height:120px; border-radius:50%;
      object-fit:cover; margin-bottom:12px;
    }
    .profile-card input[type="text"] {
      width:100%; margin-bottom:12px; padding:10px;
      border:none; border-radius:8px;
    }
    .section { width:100%; margin-top:20px; }
    .section h3 { margin-bottom:10px; color:#6ee7ff; }
    .grid {
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap:10px;
    }
    label {
      display:flex; align-items:center; gap:6px;
      background:#2a2f37; padding:6px 10px; border-radius:8px;
      cursor:pointer;
    }
    input[type="checkbox"] { transform: scale(1.2); }
    button {
      margin-top:20px;
      background:#6ee7ff; border:none; padding:12px 18px;
      border-radius:8px; cursor:pointer; font-weight:bold; color:#0e0f12;
    }

    @media (max-width:768px) {
      nav { flex-wrap:wrap; }
      nav a { margin:4px 6px; font-size:15px; }
    }
  </style>
</head>

<body>
  <header>
    <nav>
