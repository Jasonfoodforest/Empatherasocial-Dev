<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support - EmpathEra Social</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: rgba(0,0,0,0.7);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.4);
      width: 350px;
    }
    h1 {
      margin-bottom: 20px;
      color: #00f2fe;
    }
    a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      border-radius: 8px;
      background: #00c6ff;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s;
    }
    a:hover {
      background: #0072ff;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Contact Support</h1>
    <p>You can reach us anytime at:</p>
    <a href="mailto:nghia@empatherasocial.com">nghia@empatherasocial.com</a>
  </div>
</body>
</html>
