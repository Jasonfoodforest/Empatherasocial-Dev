<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Reset + Seed Firestore</title>
  </head>
  <body>
    <h1>Resetting and Seeding Firestore… check console (F12)</h1>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
      import {
        getAuth,
        signInAnonymously,
      } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
      import {
        getFirestore,
        collection,
        doc,
        setDoc,
        addDoc,
        deleteDoc,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

      // 🔑 Firebase config
      import { firebaseConfig } from "./firebase-config.js";

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const userA = "helper1@empatherasocial.com";
      const userB = "jasonfoodforest714@gmail.com";

      async function seed() {
        console.log("🌱 Seeding start…");

        // --- CLEANUP old docs (optional)
        try {
          await deleteDoc(doc(db, "chats", `${userA}_${userB}`));
        } catch (e) {
          console.log("No old direct chat to delete");
        }
        try {
          await deleteDoc(doc(db, "groups", "seed-group-1"));
        } catch (e) {
          console.log("No old group to delete");
        }

        // --- DIRECT CHAT
        const chatId = `${userA}_${userB}`;
        await setDoc(doc(db, "chats", chatId), {
          participants: [userA, userB],
          createdAt: serverTimestamp(),
          lastAt: serverTimestamp(),
          lastMsg: "Hello from seed",
        });

        await addDoc(collection(db, "chats", chatId, "messages"), {
          text: "Hello from seed",
          senderEmail: userA,
          createdAt: serverTimestamp(),
        });

        console.log("✅ Direct chat + message created");

        // --- GROUP
        const groupId = "seed-group-1";
        await setDoc(doc(db, "groups", groupId), {
          name: "Seed Group",
          members: [userA, userB],
          createdAt: serverTimestamp(),
          lastAt: serverTimestamp(),
          lastMsg: "Hello group from seed",
        });

        await addDoc(collection(db, "groupMessages", groupId, "items"), {
          text: "Welcome to the group 🎉",
          senderEmail: userB,
          createdAt: serverTimestamp(),
        });

        console.log("✅ Group + group message created");
        console.log("🌱 Reset + Seed complete! Check Firestore.");
      }

      signInAnonymously(auth)
        .then(() => seed())
        .catch((e) => console.error("Auth failed", e));
    </script>
  </body>
</html>
