<!doctype html>
<html>
  <head>
    <title>Reset + Seed Firestore</title>
  </head>
  <body>
    <h1>Resetting and Seeding Firestore... check console (F12)</h1>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
      import {
        getFirestore,
        collection,
        doc,
        setDoc,
        addDoc,
        deleteDoc,
        getDocs,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";
      import {
        getAuth,
        signInAnonymously,
      } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

      // 🔑 Your Firebase config
      const firebaseConfig = {
        apiKey: "AIzaSyCegX-9F8lvrBr8SU8-9kva0_P8o2Ik81A",
        authDomain: "empatherasocial-dev.firebaseapp.com",
        projectId: "empatherasocial-dev",
        storageBucket: "empatherasocial-dev.firebasestorage.app",
        messagingSenderId: "890072969016",
        appId: "1:890072969016:web:27640b219e0564331c5bcd",
      };

      // Init
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      const userA = "helper1@empatherasocial.com";
      const userB = "jasonfoodforest714@gmail.com";

      async function resetAndSeed() {
        console.log("🌱 Reset + Seed starting...");

        // --- Clean old data ---
        const collections = ["chats", "groups", "groupMessages"];
        for (let c of collections) {
          const snap = await getDocs(collection(db, c));
          snap.forEach(async (d) => {
            await deleteDoc(doc(db, c, d.id));
            console.log("Deleted", c, d.id);
          });
        }

        // --- Direct Chat + Messages ---
        const chatId = `${userA}_${userB}`;
        const chatRef = doc(db, "chats", chatId);
        await setDoc(chatRef, {
          participants: [userA, userB],
          createdAt: serverTimestamp(),
          lastAt: serverTimestamp(),
          lastMsg: "Hello from seed!",
        });

        await addDoc(collection(chatRef, "messages"), {
          senderEmail: userA,
          text: "Hello from seed!",
          createdAt: serverTimestamp(),
        });

        console.log("✅ Direct chat seeded");

        // --- Group + Messages ---
        const groupId = "seed-group-1";
        const groupRef = doc(db, "groups", groupId);
        await setDoc(groupRef, {
          name: "Seed Group",
          members: [userA, userB],
          createdAt: serverTimestamp(),
          lastAt: serverTimestamp(),
          lastMsg: "Hello group from seed!",
        });

        await addDoc(collection(db, `groupMessages/${groupId}/items`), {
          senderEmail: userB,
          text: "Welcome to the group 🎉",
          createdAt: serverTimestamp(),
        });

        console.log("✅ Group seeded");

        console.log("🌱 Reset + Seed complete! Check Firestore.");
      }

      // Run after anonymous login
      signInAnonymously(auth)
        .then(() => resetAndSeed())
        .catch((err) => console.error("Auth failed", err));
    </script>
  </body>
</html>
