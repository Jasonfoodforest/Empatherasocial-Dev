<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to EmpathEra AI...</title>
  <meta name="description" content="Redirecting to EmpathEra AI login page." />

  <!-- Instant redirect -->
  <meta http-equiv="refresh" content="0; url=https://ai.empatherasocial.com/login.html" />

  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 1rem;
      opacity: 0.8;
    }
    .spinner {
      margin-top: 20px;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #00ffae;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    // JS fallback in case meta redirect fails
    setTimeout(() => {
      window.location.href = "https://ai.empatherasocial.com/login.html";
    }, 500);
  </script>
</head>

<body>
  <h1>Redirecting to EmpathEra AI...</h1>
  <p>Please wait a moment while we connect you to the AI login portal.</p>
  <div class="spinner"></div>
</body>
</html>
